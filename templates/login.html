{% load socialaccount %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Welcome Back</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #B88A5D, #805936, #4e3827);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            background: #fff;
            padding: 42px 38px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.25);
            animation: fadeIn 0.7s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(25px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            width: 65px;
            height: 65px;
            background: #B88A5D;
            color: white;
            border-radius: 18px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 28px;
            margin: 0 auto 20px;
        }

        h2 {
            text-align: center;
            font-size: 28px;
            color: #30251c;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #888;
            font-size: 14px;
            margin-bottom: 32px;
        }

        .form-group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            font-weight: 600;
            color: #44362b;
            font-size: 14px;
            margin-bottom: 9px;
        }

        .input-box {
            position: relative;
        }

        .input-box i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #B88A5D;
        }

        input {
            width: 100%;
            padding: 14px 15px 14px 43px;
            border: 1px solid #e1d8cf;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
            background: #faf8f6;
        }

        input:focus {
            border-color: #B88A5D;
            box-shadow: 0 0 0 3px rgba(184,138,93,0.15);
            background: white;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 8px;
            background: linear-gradient(135deg, #B88A5D, #805936);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #624329;
            transform: translateY(-2px);
            box-shadow: 0 7px 18px rgba(128,89,54,0.3);
        }

        .signup-link {
            text-align: center;
            margin-top: 25px;
            font-size: 14px;
            color: #777;
        }

        .signup-link a {
            color: #996b40;
            font-weight: bold;
            text-decoration: none;
        }

        .signup-link a:hover {
            color: #51341e;
            text-decoration: underline;
        }

        @media(max-width: 480px) {
            .login-container {
                padding: 32px 24px;
            }

            h2 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="logo">
            <i class="fa-solid fa-user-lock"></i>
        </div>

        <h2>Welcome Back!</h2>
        <p class="subtitle">Login to continue your journey</p>

        <form method="POST" action="/login/">
            {% csrf_token %}

            <div class="form-group">
                <label>Email Address</label>
                <div class="input-box">
                    <i class="fa-solid fa-envelope"></i>
                    <input type="email"
                           name="username"
                           placeholder="Enter your email"
                           required>
                </div>
            </div>

            <div class="form-group">
                <label>Password</label>
                <div class="input-box">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password"
                           name="password"
                           placeholder="Enter your password"
                           required>
                </div>
            </div>

            <button type="submit">
                Login <i class="fa-solid fa-arrow-right"></i>
            </button>

            {% if error %}
                <p style="color:red; text-align:center; margin-top:15px;">
                    {{ error }}
                </p>
            {% endif %}

        </form>

        <a class="btn btn-danger" href="{% provider_login_url 'google' %}">Login With Gmail</a>

        <p class="signup-link">
            Don't have an account?
            <a href="/">Create Account</a>
        </p>

    </div>

</body>
</html>
